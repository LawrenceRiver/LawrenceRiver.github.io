name: Refresh visitor statistics
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: visitor-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check snapshot age
        id: freshness
        run: |
          python - <<'PYTHON'
          import datetime, json, os
          from pathlib import Path
          try:
              snapshot = json.loads(Path('visitors-f18c6d90/data.json').read_text())
              updated = datetime.datetime.fromisoformat(snapshot['updatedAt'])
              age = (datetime.datetime.now(datetime.timezone.utc) - updated).total_seconds()
          except (OSError, ValueError, KeyError):
              age = 1800
          refresh = age >= 1800 or os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('refresh=' + str(refresh).lower() + '\n')
          PYTHON
      - if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/sync-visitor-stats.py visitors-f18c6d90/data.json
      - name: Save public aggregate snapshot
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitors-f18c6d90/data.json
          git diff --cached --quiet || git commit -m 'Refresh public visitor statistics'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
